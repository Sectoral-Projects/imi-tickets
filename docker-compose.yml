services:
  bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-4000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      # Compose volume path — do not reuse the local-dev DATABASE_FILE from .env
      DATABASE_FILE: ${DOCKER_DATABASE_FILE:-/app/data/data.db}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - ${DATA_DIR:-./data}:/app/data

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      # Host port : container port (nginx listens on 80 inside the image)
      - "${WEB_PORT:-5173}:${WEB_CONTAINER_PORT:-80}"
    depends_on:
      - bot
